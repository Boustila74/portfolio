    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;

            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;

            --border-color: #334155;

        * {

            line-height: 1.6;
            padding-bottom: 40px;
        }

        header {

            border-bottom: 1px solid var(--border-color);

            align-items: center;

            top: 0;

            color: var(--text-main);
            line-height: 1.2;
        }

        .brand-name .sub-name {
            font-size: 0.85rem;
            color: var(--text-muted);

            line-height: 1.2;

        .lang-switcher select {

        }

            color: var(--text-muted);
            max-width: 750px;
            margin: 0 auto 25px auto;
        }

        .hero-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 20px;

            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: opacity 0.2s;
            display: inline-block;
        }

        .btn-secondary { background-color: var(--accent-green); color: #fff; }

        .btn-prompt { background-color: #0284c7; color: #fff; }
        .btn-outline { border: 1px solid var(--border-color); color: var(--text-main); }
        .btn:hover { opacity: 0.9; }

        .section-title {
            font-size: 1.5rem;
            margin: 40px 0 20px 0;
            border-right: 4px solid var(--accent-color);
            padding-right: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            text-align: start;
        }

        .card h3 {
            font-size: 1.15rem;
            margin-bottom: 10px;
            color: #60a5fa;
        }

        .card p {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .contact-group-title {
            font-size: 1.1rem;
            color: #60a5fa;
            margin: 20px 0 10px 0;
            font-weight: 600;
        }

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            text-decoration: none;
            color: var(--text-main);
        }
