<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>السعيد بوسطيلة — Said Boustila</title>
  <meta id="page-desc" name="description" content="">
  
  <style>
    /* --- التصميم العام --- */
    :root {
      --primary: #1a1a1a;
      --accent: #d4af37;
      --bg: #f9f9f9;
      --text: #333;
      --border: #ddd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      margin-top: 40px;
    }

    /* --- أزرار اللغة --- */
    .language-switcher {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .language-switcher button {
      padding: 8px 15px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
      color: var(--text);
    }

    .language-switcher button:hover,
    .language-switcher button[aria-current="true"] {
      background: var(--primary);
      color: var(--accent);
      border-color: var(--primary);
    }

    /* --- النموذج --- */
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-weight: bold;
      font-size: 0.9rem;
      color: var(--primary);
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
      background: #fafafa;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    /* --- أزرار الإرسال --- */
    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    button.btn-send {
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button.btn-send:active {
      transform: scale(0.98);
    }

    .btn-wa {
      background-color: #25D366;
      color: white;
    }

    .btn-email {
      background-color: var(--primary);
      color: var(--accent);
    }

    .error-msg {
      color: #d32f2f;
      font-size: 0.9rem;
      display: none;
      background: #ffebee;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
    }

    /* --- تجاوب الشاشات الصغيرة --- */
    @media (max-width: 500px) {
      .action-buttons {
        grid-template-columns: 1fr;
      }
      .container {
        padding: 20px;
        margin-top: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- أزرار اللغة -->
    <div class="language-switcher">
      <button data-lang="ar">العربية</button>
      <button data-lang="en">English</button>
      <button data-lang="fr">Français</button>
      <button data-lang="de">Deutsch</button>
    </div>

    <!-- النموذج -->
    <form id="contact-form">
      
      <div class="form-group">
        <label for="f_name" data-i18n="fn">الاسم</label>
        <input type="text" id="f_name" required>
      </div>

      <div class="form-group">
        <label for="f_contact" data-i18n="fc">وسيلة التواصل</label>
        <input type="text" id="f_contact">
      </div>

      <div class="form-group">
        <label for="f_service" data-i18n="fs">نوع الخدمة</label>
        <select id="f_service">
          <option value="s1" data-i18n-opt="s1">التصميم الجرافيكي</option>
          <option value="s2" data-i18n-opt="s2">التصوير الفوتوغرافي</option>
          <option value="s3" data-i18n-opt="s3">المونتاج</option>
          <option value="s4" data-i18n-opt="s4">صناعة المحتوى</option>
          <option value="s5" data-i18n-opt="s5">حلول الذكاء الاصطناعي</option>
          <option value="s6" data-i18n-opt="s6">تصميم المواقع</option>
        </select>
      </div>

      <div class="form-group">
        <label for="f_desc" data-i18n="fd">وصف المشروع</label>
        <textarea id="f_desc" required></textarea>
      </div>

      <div class="form-group">
        <label for="f_budget" data-i18n="fb">الميزانية (اختياري)</label>
        <input type="text" id="f_budget">
      </div>

      <div class="form-group">
        <label for="f_links" data-i18n="fl">روابط مرجعية (اختياري)</label>
        <input type="text" id="f_links">
      </div>
      
      <p id="form-error" class="error-msg" data-i18n="invalid">يرجى ملء الاسم ووصف المشروع على الأقل.</p>
      
      <div class="action-buttons">
        <button type="button" class="btn-send btn-wa" onclick="sendWhatsApp()">
          <span>💬</span> <span data-i18n="fw">إرسال عبر واتساب</span>
        </button>
        <button type="button" class="btn-send btn-email" onclick="sendEmail()">
          <span>✉️</span> <span data-i18n="fm">إرسال عبر البريد</span>
        </button>
      </div>

    </form>
  </div>

  <script>
    // ... (نفس كود الجافاسكريبت الذي أرسلته لك في الرسالة السابقة بالكامل) ...
    const T = {
      ar: {
        name: "السعيد بوسطيلة", title: "السعيد بوسطيلة — مصمم جرافيك ومصوّر ومبدع محتوى", desc: "شريك إبداعي ورقمي من الجزائر.",
        s1: "التصميم الجرافيكي والإعلانات", s2: "التصوير الفوتوغرافي التجاري", s3: "المونتاج والإنتاج المرئي", s4: "صناعة المحتوى والتخطيط التسويقي", s5: "حلول الذكاء الاصطناعي والوكلاء", s6: "تصميم صفحات الويب والمواقع",
        fn: "الاسم", fc: "وسيلة التواصل", fs: "نوع الخدمة", fd: "وصف المشروع", fb: "الميزانية التقريبية (اختياري)", fl: "روابط مرجعية (اختياري)",
        fw: "إرسال عبر واتساب", fm: "إرسال عبر البريد", invalid: "يرجى ملء الاسم ووصف المشروع على الأقل."
      },
      en: {
        name: "Said Boustila", title: "Said Boustila — Graphic Designer", desc: "A creative and digital partner from Algeria.",
        s1: "Graphic design & advertising", s2: "Commercial photography", s3: "Video editing & production", s4: "Content & marketing planning", s5: "AI solutions & agents", s6: "Web design",
        fn: "Name", fc: "Contact method", fs: "Service type", fd: "Project description", fb: "Estimated budget (optional)", fl: "Reference links (optional)",
        fw: "Send via WhatsApp", fm: "Send via email", invalid: "Please complete the name and project description."
      },
      fr: {
        name: "Said Boustila", title: "Said Boustila — Graphiste", desc: "Un partenaire créatif et digital d’Algérie.",
        s1: "Design graphique & publicité", s2: "Photographie commerciale", s3: "Montage vidéo & production", s4: "Contenu & planification marketing", s5: "Solutions IA & agents", s6: "Design web",
        fn: "Nom", fc: "Moyen de contact", fs: "Type de service", fd: "Description du projet", fb: "Budget estimé (facultatif)", fl: "Liens de référence (facultatif)",
        fw: "Envoyer via WhatsApp", fm: "Envoyer via e-mail", invalid: "Veuillez remplir le nom et la description du projet."
      },
      de: {
        name: "Said Boustila", title: "Said Boustila — Grafikdesigner", desc: "Ein kreativer digitaler Partner aus Algerien.",
        s1: "Grafikdesign & Werbung", s2: "Kommerzielle Fotografie", s3: "Videoediting & Produktion", s4: "Content & Marketingplanung", s5: "KI-Lösungen & Agenten", s6: "Webdesign",
        fn: "Name", fc: "Kontaktmethode", fs: "Dienstleistung", fd: "Projektbeschreibung", fb: "Geschätztes Budget (optional)", fl: "Referenzlinks (optional)",
        fw: "Per WhatsApp senden", fm: "Per E-Mail senden", invalid: "Bitte füllen Sie Name und Projektbeschreibung aus."
      }
    };

    const pageTitle = document.getElementById("page-title");
    const pageDesc = document.getElementById("page-desc");
    const langButtons = document.querySelectorAll("[data-lang]");
    
    function applyLanguage(lang) {
      const current = T[lang] || T.ar;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      
      if (pageTitle) pageTitle.textContent = current.title;
      if (pageDesc) pageDesc.setAttribute("content", current.desc);

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.dataset.i18n;
        if (current[key]) el.textContent = current[key];
      });

      document.querySelectorAll("[data-i18n-opt]").forEach(el => {
        const key = el.dataset.i18nOpt;
        if (current[key]) el.textContent = current[key];
      });

      langButtons.forEach(btn => {
        const isCurrent = btn.dataset.lang === lang;
        btn.setAttribute("aria-current", isCurrent ? "true" : "false");
      });
    }

    langButtons.forEach(btn => {
      btn.addEventListener("click", () => applyLanguage(btn.dataset.lang));
    });

    function validateForm() {
      const name = document.getElementById("f_name").value.trim();
      const desc = document.getElementById("f_desc").value.trim();
      const err = document.getElementById("form-error");
      if (!name || !desc) {
        if (err) err.style.display = "block";
        return false;
      }
      if (err) err.style.display = "none";
      return true;
    }

    function buildMessage() {
      const lang = document.documentElement.lang || "ar";
      const current = T[lang] || T.ar;
      const name = document.getElementById("f_name").value.trim();
      const contact = document.getElementById("f_contact").value.trim();
      const serviceValue = document.getElementById("f_service").value;
      const serviceName = current[serviceValue] || serviceValue;
      const desc = document.getElementById("f_desc").value.trim();
      const budget = document.getElementById("f_budget").value.trim();
      const links = document.getElementById("f_links").value.trim();

      if (lang === "fr") return ["Bonjour,", "", `Nom : ${name}`, `Moyen de contact : ${contact}`, `Type de service : ${serviceName}`, `Description du projet : ${desc}`, budget ? `Budget estimé : ${budget}` : "", links ? `Liens de référence : ${links}` : "", "", "Merci."].filter(Boolean).join("\n");
      if (lang === "en") return ["Hello,", "", `Name: ${name}`, `Contact method: ${contact}`, `Service type: ${serviceName}`, `Project description: ${desc}`, budget ? `Estimated budget: ${budget}` : "", links ? `Reference links: ${links}` : "", "", "Thank you."].filter(Boolean).join("\n");
      if (lang === "de") return ["Hallo,", "", `Name: ${name}`, `Kontaktmethode: ${contact}`, `Dienstleistung: ${serviceName}`, `Projektbeschreibung: ${desc}`, budget ? `Geschätztes Budget: ${budget}` : "", links ? `Referenzlinks: ${links}` : "", "", "Vielen Dank."].filter(Boolean).join("\n");
      
      return ["السلام عليكم", "", `الاسم: ${name}`, `وسيلة التواصل: ${contact}`, `نوع الخدمة: ${serviceName}`, `وصف المشروع: ${desc}`, budget ? `الميزانية التقريبية: ${budget}` : "", links ? `روابط مرجعية: ${links}` : "", "", "شكراً"].filter(Boolean).join("\n");
    }

    function sendWhatsApp() {
      if (!validateForm()) return;
      const msg = encodeURIComponent(buildMessage());
      const url = `https://wa.me/213674767958?text=${msg}`;
      window.open(url, "_blank", "noopener");
    }

    function sendEmail() {
      if (!validateForm()) return;
      const lang = document.documentElement.lang || "ar";
      const current = T[lang] || T.ar;
      const name = document.getElementById("f_name").value.trim();
      const contact = document.getElementById("f_contact").value.trim();
      const serviceValue = document.getElementById("f_service").value;
      const serviceName = current[serviceValue] || serviceValue;
      const desc = document.getElementById("f_desc").value.trim();
      const budget = document.getElementById("f_budget").value.trim();
      const links = document.getElementById("f_links").value.trim();

      let subjectText = "", bodyText = "";
      if (lang === "fr") {
        subjectText = `Nouvelle demande de service : ${serviceName}`;
        bodyText = `Nom : ${name}\nMoyen de contact : ${contact}\nType de service : ${serviceName}\nDescription du projet :\n${desc}` + (budget ? `\n\nBudget estimé : ${budget}` : "") + (links ? `\nLiens de référence : ${links}` : "");
      } else if (lang === "en") {
        subjectText = `New service request: ${serviceName}`;
        bodyText = `Name: ${name}\nContact method: ${contact}\nService type: ${serviceName}\nProject description:\n${desc}` + (budget ? `\n\nEstimated budget: ${budget}` : "") + (links ? `\nReference links: ${links}` : "");
      } else if (lang === "de") {
        subjectText = `Neue Dienstanfrage: ${serviceName}`;
        bodyText = `Name: ${name}\nKontaktmethode: ${contact}\nDienstleistung: ${serviceName}\nProjektbeschreibung:\n${desc}` + (budget ? `\n\nGeschätztes Budget: ${budget}` : "") + (links ? `\nReferenzlinks: ${links}` : "");
      } else {
        subjectText = `طلب خدمة جديد: ${serviceName}`;
        bodyText = `الاسم: ${name}\nوسيلة التواصل: ${contact}\nنوع الخدمة: ${serviceName}\nوصف المشروع:\n${desc}` + (budget ? `\n\nالميزانية التقريبية: ${budget}` : "") + (links ? `\nروابط مرجعية: ${links}` : "");
      }

      window.location.href = `mailto:boustilasaid7@gmail.com?subject=${encodeURIComponent(subjectText)}&body=${encodeURIComponent(bodyText)}`;
    }

    applyLanguage("ar");
  </script>
</body>
</html>
