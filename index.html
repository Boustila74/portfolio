  const pageTitle = document.getElementById("page-title");
  const pageDesc = document.getElementById("page-desc");
  const langButtons = document.querySelectorAll("[data-lang]");
  const langMap = {
    ar: "ar",
    en: "en",
    fr: "fr",
    de: "de"
  };

  function applyLanguage(lang) {
    const current = T[langMap[lang]] || T.ar;

    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

    if (pageTitle) {
      pageTitle.textContent = current.title;
    }
    if (pageDesc) {
      pageDesc.setAttribute("content", current.desc);
    }

    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.dataset.i18n;
      if (current[key]) {
        el.textContent = current[key];
      }
    });

    document.querySelectorAll("[data-i18n-opt]").forEach(el => {
      const key = el.dataset.i18nOpt;
      if (current[key]) {
        el.textContent = current[key];
      }
    });

    langButtons.forEach(btn => {
      const isCurrent = btn.dataset.lang === lang;
      btn.setAttribute("aria-current", isCurrent ? "true" : "false");
      btn.style.opacity = isCurrent ? "1" : "0.7";
    });
  }

  langButtons.forEach(btn => {
    btn.addEventListener("click", () => applyLanguage(btn.dataset.lang));
  });

  function validateForm() {
    const name = document.getElementById("f_name").value.trim();
    const desc = document.getElementById("f_desc").value.trim();

    const err = document.getElementById("form-error");
    if (!name || !desc) {
      err.style.display = "block";
      return false;
    }

    err.style.display = "none";
    return true;
  }

  function buildMessage() {
    const lang = document.documentElement.lang || "ar";
    const selectedLang = T[lang] || T.ar;

    const name = document.getElementById("f_name").value.trim();
    const contact = document.getElementById("f_contact").value.trim();
    const service = document.getElementById("f_service").value;
    const desc = document.getElementById("f_desc").value.trim();
    const budget = document.getElementById("f_budget").value.trim();
    const links = document.getElementById("f_links").value.trim();

    const serviceName = document.querySelector("#f_service option:checked")?.textContent || service;

    return [
      "السلام عليكم",
      "",
      `الاسم: ${name}`,
      `وسيلة التواصل: ${contact}`,
      `نوع الخدمة: ${serviceName}`,
      `وصف المشروع: ${desc}`,
      budget ? `الميزانية التقريبية: ${budget}` : "",
      links ? `روابط مرجعية: ${links}` : "",
      "",
      "شكراً"
    ].filter(Boolean).join("\n");
  }

  function sendWhatsApp() {
    if (!validateForm()) return;

    const msg = encodeURIComponent(buildMessage());
    const url = `https://wa.me/213674767958?text=${msg}`;
    window.open(url, "_blank", "noopener");
  }

  function sendEmail() {
    if (!validateForm()) return;

    const name = document.getElementById("f_name").value.trim();
    const contact = document.getElementById("f_contact").value.trim();
    const service = document.querySelector("#f_service option:checked")?.textContent || "";
    const desc = document.getElementById("f_desc").value.trim();
    const budget = document.getElementById("f_budget").value.trim();
    const links = document.getElementById("f_links").value.trim();

    const subject = encodeURIComponent(`طلب خدمة جديد: ${service}`);
    const body = encodeURIComponent(
      `الاسم: ${name}\n` +
      `وسيلة التواصل: ${contact}\n` +
      `نوع الخدمة: ${service}\n` +
      `وصف المشروع:\n${desc}\n` +
      (budget ? `\nالميزانية التقريبية: ${budget}` : "") +
      (links ? `\nروابط مرجعية: ${links}` : "")
    );

    window.location.href = `mailto:boustilasaid7@gmail.com?subject=${subject}&body=${body}`;
  }

  applyLanguage("ar");
