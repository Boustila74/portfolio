<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوسطيلة السعيد | Boustila Said - Portfolio</title>
    <meta name="description" content="الموقع المهني لبوسطيلة السعيد - صناعة المحتوى، التصميم الجرافيكي، التصوير التجاري، المونتاج، والذكاء الاصطناعي.">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #2563eb;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 40px;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-name {
            display: flex;
            flex-direction: column;
            gap: 2px;
            text-align: start;
        }

        .brand-name .primary-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-main);
            line-height: 1.2;
        }

        .brand-name .sub-name {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            line-height: 1.2;
        }

        .lang-switcher select {
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .hero {
            text-align: center;
            padding: 40px 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .hero h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .hero p.tagline {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 750px;
            margin: 0 auto 25px auto;
        }

        .hero-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
