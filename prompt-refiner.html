<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">محسّن البرومبت التفاعلي | بوسطيلة السعيد</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #2563eb;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; line-height: 1.6; }

        header {
            max-width: 650px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-name {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .lang-switcher select {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        .app-card {
            max-width: 650px; margin: 0 auto; background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 12px; padding: 25px;
        }

        h2 { color: #60a5fa; margin-bottom: 8px; text-align: center; }
        p.subtitle { color: var(--text-muted); text-align: center; margin-bottom: 25px; font-size: 0.95rem; }

        .form-group { margin-bottom: 18px; text-align: start; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }

        input[type="text"], textarea, select {
            width: 100%; padding: 12px; background: var(--bg-color);
            border: 1px solid var(--border-color); border-radius: 8px;
            color: var(--text-main); font-size: 0.95rem; outline: none;
        }

        textarea { height: 90px; resize: vertical; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .output-box {
            background: rgba(139, 92, 246, 0.1); border: 1px solid var(--accent-purple);
            border-radius: 10px; padding: 18px; margin-top: 25px; position: relative;
            text-align: start;
        }

        .output-title { font-weight: bold; color: #a78bfa; margin-bottom: 10px; font-size: 0.95rem; }

        pre {
            white-space: pre-wrap; word-wrap: break-word; font-family: monospace;
            background: #090d16; padding: 12px; border-radius: 6px; font-size: 0.9rem; color: #e2e8f0;
            text-align: left; direction: ltr;
        }

        .btn-copy {
            display: block; width: 100%; background: var(--accent-purple); color: white;
            text-align: center; padding: 12px; border-radius: 8px; text-decoration: none;
            font-weight: bold; font-size: 0.95rem; margin-top: 15px; border: none; cursor: pointer;
        }

        .btn-copy:hover { opacity: 0.9; }
        .btn-back { display: block; text-align: center; margin-top: 20px; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }

        [dir="ltr"] pre { text-align: left; }
    </style>
</head>
<body>

    <header>
        <div class="brand-name" id="headerBrand">بوسطيلة السعيد</div>
        <div class="lang-switcher">
            <select id="languageSelect" onchange="switchLanguage(this.value)">
                <option value="ar" selected>العربية (AR)</option>
                <option value="fr">Français (FR)</option>
                <option value="en">English (EN)</option>
                <option value="de">Deutsch (DE)</option>
            </select>
        </div>
    </header>

    <div class="app-card">
        <h2 id="appTitle">🪄 محسّن ومصمم البرومبت الذكي</h2>
        <p class="subtitle" id="appSubtitle">حوّل الفكرة البسيطة إلى أمر (Prompt) احترافي عالي الدقة موجه للذكاء الاصطناعي</p>

        <div class="form-group">
            <label for="userTopic" id="labelTopic">1. الفكرة الأساسية أو الطلب :</label>
            <textarea id="userTopic" placeholder="اكتب فكرتك هنا..." oninput="generatePrompt()"></textarea>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="aiRole" id="labelRole">2. دور الذكاء الاصطناعي :</label>
                <select id="aiRole" onchange="generatePrompt()">
                    <!-- يتم تعبئتها ديناميكياً عبر الجافاسكريبت حسب اللغة -->
                </select>
            </div>

            <div class="form-group">
                <label for="toneStyle" id="labelTone">3. أسلوب ونبرة الطرح :</label>
                <select id="toneStyle" onchange="generatePrompt()">

                </select>
            </div>
        </div>
